name: Release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci

      - name: Set app version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: >
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';
          const j=JSON.parse(fs.readFileSync(f,'utf8'));
          j.version=process.env.TAG.replace(/^v/,'');
          fs.writeFileSync(f,JSON.stringify(j,null,2));
          console.log('Building version',j.version);"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Berzh AI ${{ github.ref_name }}"
          releaseBody: "Download the setup file below. Installed copies update themselves."
          releaseDraft: false
          prerelease: false